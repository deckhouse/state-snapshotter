---
# Admin-kubeconfig ClusterRole: manual kubectl / demo-e2e (NOT controller SA).
# - Create/read/delete Snapshots; patch Snapshot/SnapshotContent status for demo graph wiring (merge_child_graph_into_root).
# - Read per-CR manifest subresources (manifests-download / manifests-with-data-restoration).
# - Read-only MCR/MCP/ObjectKeeper for diagnostics.
# - Do NOT grant objectkeepers patch/update (forced TTL uses demo-e2e temp RBAC or cluster-admin).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:state-snapshotter:admin-kubeconfig
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - state-snapshotter.deckhouse.io
  resources:
  - manifestcapturerequests
  - manifestcheckpoints
  verbs:
  - get
  - list
  - watch
# Chunk payloads are controller-internal only: admin/manual paths MUST download via the per-CR
# /manifests-download subresources below, never by reading the raw chunk objects directly.
- apiGroups:
  - state-snapshotter.deckhouse.io
  resources:
  - snapshots
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - state-snapshotter.deckhouse.io
  resources:
  - snapshots/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - state-snapshotter.deckhouse.io
  resources:
  - snapshotcontents
  verbs:
  - get
  - list
  - watch
  - patch
  - update
- apiGroups:
  - state-snapshotter.deckhouse.io
  resources:
  - snapshotcontents/status
  verbs:
  - get
  - patch
  - update
# Per-CR manifest read subresources. The whole-subtree /manifests aggregation was removed: export
# now walks the tree client-side and downloads each node's own manifests via /manifests-download.
# The core group serves manifests-download / manifests-with-data-restoration ONLY for the core Snapshot
# kind; domain snapshot kinds are addressed through their own aggregated group (see the demo group grant
# below). manifestcheckpoints/manifests is the raw single-checkpoint read served directly by the archive handler.
- apiGroups:
  - subresources.state-snapshotter.deckhouse.io
  resources:
  - snapshots/manifests-download
  - snapshots/manifests-with-data-restoration
  - manifestcheckpoints/manifests
  verbs:
  - get
# A domain snapshot node is exported (manifests-download, a proxy to the cluster-scoped content download),
# imported (manifests-and-children-refs-upload, the bind-first domain facade that writes childRefs on its own
# CR and forwards manifests to the cluster-scoped content layer), and restored
# (manifests-with-data-restoration) through its OWN aggregated group, not the core group. The core group
# serves these subresources ONLY for the core Snapshot kind — never for domain GVR (→ 404). Concrete domain
# groups/resources are NOT enumerated here: they are domain-specific and belong to the domain module that
# ships them, so a domain module grants access to its own aggregated subresources in its own templates.
# Volume nodes: export (manifests-download), restore (manifests-with-data-restoration) and import
# (manifests-and-children-refs-upload) a single volume snapshot by namespaced VolumeSnapshot name. These
# endpoints are served by the module that owns the CSI VolumeSnapshot, under a group named after THAT
# module — which is why the group below is not one of this module's own. It is named here and not left to
# that module's chart because this is the manual-kubectl role of this module's demo and diagnostics paths:
# walking a tree with a volume in it from a shell needs both legs, and a missing grant shows up as a 403
# in the middle of a demo.
- apiGroups:
  - subresources.storage-foundation.deckhouse.io
  resources:
  - volumesnapshots/manifests-download
  - volumesnapshots/manifests-with-data-restoration
  verbs:
  - get
- apiGroups:
  - subresources.storage-foundation.deckhouse.io
  resources:
  - volumesnapshots/manifests-and-children-refs-upload
  verbs:
  - create
# The same endpoints under the group they were served from before the move. A SubjectAccessReview is
# built from the group in the URL, so without these two rules a caller still addressing the old path is
# answered 403 even though the server-side compatibility alias answers it — which is exactly the check
# the manual and end-to-end walkthroughs of that alias make through this kubeconfig. They go away
# together with the alias, in one change.
- apiGroups:
  - subresources.snapshot.storage.k8s.io
  resources:
  - volumesnapshots/manifests-download
  - volumesnapshots/manifests-with-data-restoration
  verbs:
  - get
- apiGroups:
  - subresources.snapshot.storage.k8s.io
  resources:
  - volumesnapshots/manifests-and-children-refs-upload
  verbs:
  - create
- apiGroups:
  - deckhouse.io
  resources:
  - objectkeepers
  verbs:
  - get
  - list
  - watch
# Domain inventory and generated child snapshots are NOT granted here: those resource names are
# domain-specific, so the module that ships a domain grants access to its own CRs in its own templates.
- apiGroups:
  - state-snapshotter.deckhouse.io
  resources:
  - customsnapshotdefinitions
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - state-snapshotter.deckhouse.io
  resources:
  - customsnapshotdefinitions/status
  verbs:
  - get
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:state-snapshotter:admin-kubeconfig
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:state-snapshotter:admin-kubeconfig
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: kubeadm:cluster-admins

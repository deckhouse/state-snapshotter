apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "controller")) | nindent 2 }}
spec:
  type: ClusterIP
  ports:
  - port: 443
    targetPort: https
    protocol: TCP
    name: https
    appProtocol: https
  # The port of the kube-rbac-proxy, not of the controller: the controller keeps
  # its metrics on 127.0.0.1 and only the proxy can reach them.
  - port: {{ .Values.stateSnapshotter.internal.controllerMetricsProxyPort }}
    targetPort: https-metrics
    protocol: TCP
    name: https-metrics
  {{- /* No health port here: /healthz and /readyz are for kubelet, which reaches the
         pod directly. Publishing them through the Service only made two unauthenticated
         endpoints reachable from the whole pod network. */}}
  selector:
    app: controller


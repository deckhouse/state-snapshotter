{{- $controllerEnvs := list }}
{{- $snapshotTtlAfterDelete := .Values.stateSnapshotter.snapshotTtlAfterDelete | default "" | trim }}
{{- if $snapshotTtlAfterDelete }}
{{- $controllerEnvs = append $controllerEnvs (dict "name" "STATE_SNAPSHOTTER_SNAPSHOT_TTL_AFTER_DELETE" "value" $snapshotTtlAfterDelete) }}
{{- end }}
{{- $config := dict
  "valuesKey" "stateSnapshotter"
  "onMasterNode" false
  "priorityClass" "cluster-medium"
  "controllerImageName" "stateSnapshotterController"
  "controllerMaxMemory" "100Mi"
  "controllerMetricsPort" .Values.stateSnapshotter.internal.controllerMetricsPort
  "controllerMetricsProxyPort" .Values.stateSnapshotter.internal.controllerMetricsProxyPort
  "controllerMetricsInProcessAuthorization" true
  "controllerArgs" (list
    "--api-addr=:8443"
    "--api-tls-cert-file=/certs/tls.crt"
    "--api-tls-private-key-file=/certs/tls.key")
  "additionalControllerPorts" (list
    (dict "containerPort" 8443 "name" "https" "protocol" "TCP")
    (dict "containerPort" 8081 "name" "health" "protocol" "TCP")
    (dict "containerPort" 9443 "name" "webhooks" "protocol" "TCP"))
  "additionalControllerEnvs" (concat $controllerEnvs (list
    (dict "name" "WEBHOOKS_BIND_ADDRESS" "value" ":9443")
    (dict "name" "WEBHOOKS_CERT_DIR" "value" "/certs")))
  "additionalControllerVolumeMounts" (list
    (dict "name" "tls" "mountPath" "/certs" "readOnly" true))
  "additionalVolumes" (list
    (dict "name" "tls" "secret" (dict "secretName" "state-snapshotter-tls-certs")))
}}
{{- include "helm_lib_module_controller_manifests" (list . $config) }}

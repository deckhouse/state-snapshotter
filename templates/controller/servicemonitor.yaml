{{- if (include "helm_lib_api_version_exists" (list . "monitoring.coreos.com/v1/ServiceMonitor")) }}
{{- /*
  The metrics are served by the kube-rbac-proxy of the pod, over TLS and behind an
  authorization check, so the scrape carries the Prometheus token. The certificate
  is the proxy's own, hence insecureSkipVerify.
*/ -}}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: state-snapshotter-controller
  namespace: d8-monitoring
  {{- include "helm_lib_module_labels" (list $ (dict "prometheus" "main")) | nindent 2 }}
spec:
  endpoints:
  - port: https-metrics
    scheme: https
    path: /metrics
    bearerTokenSecret:
      name: "prometheus-token"
      key: "token"
    tlsConfig:
      insecureSkipVerify: true
    relabelings:
    - regex: endpoint|namespace|pod|container
      action: labeldrop
    - targetLabel: job
      replacement: state-snapshotter-controller
    - targetLabel: tier
      replacement: cluster
    - sourceLabels: [__meta_kubernetes_endpointslice_endpoint_conditions_ready]
      regex: "true"
      action: keep
  selector:
    matchLabels:
      app: controller
  namespaceSelector:
    matchNames:
    - d8-{{ .Chart.Name }}
{{- end }}

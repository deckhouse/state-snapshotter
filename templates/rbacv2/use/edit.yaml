{{- if eq (include "state-snapshotter.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: state-snapshotter
    rbac.deckhouse.io/aggregate-to-namespace-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "namespace-capability.state-snapshotter.edit"
    rbac.deckhouse.io/scope: namespace
  name: d8:namespace-capability:state-snapshotter:edit
  annotations:
    en.meta.deckhouse.io/title: "Module state-snapshotter: edit"
    ru.meta.deckhouse.io/title: "Модуль state-snapshotter: редактирование"
    en.meta.deckhouse.io/description: "Manage state-snapshotter resources in a namespace."
    ru.meta.deckhouse.io/description: "Управление ресурсами модуля state-snapshotter в пространстве имён."
rules:
  - apiGroups:
      - state-snapshotter.deckhouse.io
    resources:
      - manifestcapturerequests
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: state-snapshotter
    rbac.deckhouse.io/aggregate-to-kubernetes-as: manager
    rbac.deckhouse.io/kind: use
  name: d8:use:capability:module:state-snapshotter:edit
rules:
  - apiGroups:
      - state-snapshotter.deckhouse.io
    resources:
      - manifestcapturerequests
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- end }}

{{- if eq (include "state-snapshotter.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: state-snapshotter
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.state-snapshotter.view"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-state-snapshotter
  name: d8:system-capability:state-snapshotter:view
  annotations:
    en.meta.deckhouse.io/title: "Module state-snapshotter: view cluster resources"
    ru.meta.deckhouse.io/title: "Модуль state-snapshotter: просмотр кластерных ресурсов"
    en.meta.deckhouse.io/description: "Read-only access to the cluster-scoped resources of the state-snapshotter module (ManifestCheckpoint)."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к кластерным ресурсам модуля state-snapshotter (ManifestCheckpoint)."
rules:
  - apiGroups:
      - state-snapshotter.deckhouse.io
    resources:
      - manifestcheckpoints
    verbs:
      - get
      - list
      - watch
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: state-snapshotter
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-state-snapshotter
  name: d8:manage:permission:module:state-snapshotter:view
rules:
  - apiGroups:
      - state-snapshotter.deckhouse.io
    resources:
      - manifestcheckpoints
    verbs:
      - get
      - list
      - watch
{{- end }}

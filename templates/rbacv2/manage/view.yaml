{{- if eq (include "state-snapshotter.rbacv2_new_scheme" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:state-snapshotter:view
  labels:
    heritage: deckhouse
    module: state-snapshotter
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/capability: system-capability.state-snapshotter.view
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/namespace: d8-state-snapshotter
    rbac.deckhouse.io/scope: system
  annotations:
    en.meta.deckhouse.io/description: "Read-only access to the state-snapshotter module configuration."
    en.meta.deckhouse.io/title: "Module state-snapshotter: view configuration"
    ru.meta.deckhouse.io/description: "Доступ только на чтение к конфигурации модуля state-snapshotter."
    ru.meta.deckhouse.io/title: "Модуль state-snapshotter: просмотр конфигурации"
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - moduleconfigs
  resourceNames:
  - state-snapshotter
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - state-snapshotter.deckhouse.io
  resources:
  - customsnapshotdefinitions
  - manifestcheckpoints
  verbs:
  - get
  - list
  - watch
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: state-snapshotter
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-state-snapshotter
  name: d8:manage:permission:module:state-snapshotter:view
rules:
  - apiGroups:
      - state-snapshotter.deckhouse.io
    resources:
      - customsnapshotdefinitions
      - manifestcheckpoints
    verbs:
      - get
      - list
      - watch
{{- end }}

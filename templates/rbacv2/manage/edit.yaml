{{- if eq (include "state-snapshotter.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: state-snapshotter
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.state-snapshotter.edit"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-state-snapshotter
  name: d8:system-capability:state-snapshotter:edit
  annotations:
    en.meta.deckhouse.io/title: "Module state-snapshotter: manage cluster resources"
    ru.meta.deckhouse.io/title: "Модуль state-snapshotter: управление кластерными ресурсами"
    en.meta.deckhouse.io/description: "Create, update and delete the cluster-scoped resources of the state-snapshotter module (ManifestCheckpoint)."
    ru.meta.deckhouse.io/description: "Создание, изменение и удаление кластерных ресурсов модуля state-snapshotter (ManifestCheckpoint)."
rules:
  - apiGroups:
      - state-snapshotter.deckhouse.io
    resources:
      - manifestcheckpoints
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: state-snapshotter
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-state-snapshotter
  name: d8:manage:permission:module:state-snapshotter:edit
rules:
  - apiGroups:
      - state-snapshotter.deckhouse.io
    resources:
      - manifestcheckpoints
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- end }}

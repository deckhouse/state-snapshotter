{{- if eq (include "state-snapshotter.rbacv2_new_scheme" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:state-snapshotter:edit
  labels:
    heritage: deckhouse
    module: state-snapshotter
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/capability: system-capability.state-snapshotter.edit
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/namespace: d8-state-snapshotter
    rbac.deckhouse.io/scope: system
  annotations:
    en.meta.deckhouse.io/description: "Manage the state-snapshotter module configuration."
    en.meta.deckhouse.io/title: "Module state-snapshotter: edit configuration"
    ru.meta.deckhouse.io/description: "Управление конфигурацией модуля state-snapshotter."
    ru.meta.deckhouse.io/title: "Модуль state-snapshotter: управление конфигурацией"
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - moduleconfigs
  resourceNames:
  - state-snapshotter
  verbs:
  - create
  - delete
  - patch
  - update
{{- end }}

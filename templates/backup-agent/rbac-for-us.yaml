{{- if eq (include "state-snapshotter.rbacv2_new_scheme" .) "true" }}
# The whole permission set an external backup product needs, as one role to bind instead of a list of
# capabilities to bind one by one. A forgotten binding is invisible at setup time: a RoleBinding is
# created successfully whether or not the role it names exists, roleRef is not checked against
# anything, and the refusal surfaces only on the first request that needs the missing capability —
# typically the one that moves a volume's bytes, long after whoever wired the integration left.
#
# This is the role of DKP 1.78 and later; below 1.78 the chart ships the legacy
# d8:use:capability:module:state-snapshotter:backup_agent from templates/rbacv2/use/roles instead, and
# from 1.78 on that name survives as an alias in templates/rbacv2-compat/backup_agent.yaml.
#
# It sits OUTSIDE the RBACv2 role model on purpose. That model has no role of a module, and an axis of
# this module's own under rbac.deckhouse.io/ is an unknown lineage the platform contract refuses. So
# this is an ordinary ClusterRole: no rbac.deckhouse.io/kind, no rbac.deckhouse.io/* label at all, a
# name of this module's own (d8:state-snapshotter:...), and a selector on a label of this module,
# state-snapshotter.deckhouse.io/aggregate-to-backup-agent. Every capability it collects also
# aggregates into a level of the platform; this label only makes this role a second collector of it.
#
# There is no rules key, not even an empty one: the clusterrole-aggregation-controller fills the rules
# with the union of the rules of every ClusterRole matching the selector, and a rules key in the chart
# makes server-side apply fight it, emptying the role for a moment on every reconcile. Nothing is
# copied here, so a grant edited on a capability reaches this role without a chart change.
#
# Carrying the label is not the same as being granted it. This role composes capabilities into one
# object and hands them to nobody: until a RoleBinding names it, it grants nothing, and what it grants
# then is bounded by the namespaces of those bindings.
#
# The selector matches ANY ClusterRole in the cluster carrying both labels, not only the roles of this
# chart — which is how the volume-data transfer capability, shipped by the module that owns it, joins
# the set. What is pinned, by TestBackupAgentAxisIsCarriedByExactlyThePinnedRoles, is which roles under
# templates/rbacv2 carry the label — that subtree and no further. A role of this chart meant to be a
# member belongs under templates/rbacv2; a role outside this chart is that chart's business, and
# pointing the label at a role is a deliberate act either way.
#
# What this role does NOT carry is the condition that keeps the arrangement safe, and all of it is
# pinned by TestBackupAgentAggregateRoleCollectsOneAxisAndSpreadsThroughNone:
#
#   - no aggregation label of any name, rbac.deckhouse.io/aggregate-* or this module's own. Such a label
#     belongs on the capabilities this role collects, never on this role: composed into a platform
#     level, it hands the entire set — reading a subtree rewritten for another namespace, loading a tree
#     back in, moving a volume's bytes — to every holder of that level, merely because this module is
#     installed.
#   - no annotations at all. The access levels of the cluster roles shipped here are assembled from an
#     annotation, and a platform hook turns one on a role into bindings for that level's subjects,
#     cluster-wide bindings included — which is exactly the "grants nothing until a RoleBinding names
#     it" boundary above.
#   - no rbac.deckhouse.io/delegatable. That label puts a role into the set a project owner may hand
#     out inside their own project. This role is bound by whoever connects an external backup product
#     to the cluster, which is not a per-project decision.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: state-snapshotter
  name: d8:state-snapshotter:backup-agent
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        state-snapshotter.deckhouse.io/aggregate-to-backup-agent: "true"
        rbac.deckhouse.io/kind: capability
{{- end }}

type: object
properties:
  logLevel:
    type: string
    enum:
      - ERROR
      - WARN
      - INFO
      - DEBUG
      - TRACE
    description: Module log level.
    default: INFO
  highAvailability:
    type: boolean
    x-examples: [true, false]
    description: |
      Manually enable the high availability (HA) mode.

      By default, Deckhouse automatically decides whether to enable the HA mode.
      To learn more about the HA mode, refer to [High reliability and availability](/products/kubernetes-platform/documentation/v1/admin/configuration/high-reliability-and-availability/enable.html#enabling-ha-mode-for-individual-components).
  snapshotTtlAfterDelete:
    type: string
    default: ""
    description: |
      Recycle-bin retention window: how long a snapshot's durable data is kept after the Snapshot is deleted,
      during which it remains recoverable. Go duration, e.g. "24h", "168h".
      Empty = omit env; controller uses the built-in default of 30 days (720h).

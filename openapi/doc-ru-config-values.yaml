type: object
properties:
  logLevel:
    description: Уровень логирования модуля.
  highAvailability:
    description: |
      Ручное управление режимом отказоустойчивости.

      По умолчанию режим отказоустойчивости определяется автоматически.
      Подробнее про режим отказоустойчивости можно прочитать в разделе [Высокая надежность и доступность](/products/kubernetes-platform/documentation/v1/admin/configuration/high-reliability-and-availability/enable.html#включение-режима-ha-для-отдельных-компонентов).
  snapshotTtlAfterDelete:
    description: |
      Период хранения долговечных данных снимка после удаления объекта Snapshot. В течение этого периода снимок можно восстановить.

      Укажите длительность в формате Go, например 24h или 168h. Если значение пустое, контроллер хранит данные 30 дней (720h).

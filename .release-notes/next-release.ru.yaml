date: "2026-xx-xx"
summary: ""
highlights: []

improvements:
  - "В DKP 1.78 и новее роли `d8:system-capability:state-snapshotter:view` и `d8:system-capability:state-snapshotter:edit` дают также доступ на чтение к ModuleConfig `state-snapshotter`, а `edit` — и на запись, и несут стандартные заголовки и описания платформы, как все capability ролевой модели DKP 1.78. RBAC модуля теперь описан в `rbac.yaml`, и шаблоны RBACv2 пишутся из него."
  - "Уровень доступа `ClusterAdmin` текущей ролевой модели и уровень `viewer` подсистемы `storage` в RBACv2 читают объекты `CustomSnapshotDefinition`: администратор видит, у каких видов есть собственные снимки, и условия `Accepted`, `AccessGranted` и `Ready` каждого определения. Раньше их читал только `SuperAdmin`. Изменять их не может ни один уровень доступа."



fixes:
  - "Уровни доступа `Editor` и `Admin` текущей ролевой модели теперь могут создавать и удалять `Snapshot`, а уровень `User` читает `Snapshot` и их статус. Раньше для записи и даже чтения `Snapshot` требовался `ClusterEditor`. `Admin` также скачивает манифесты узлов снимка (`manifests-download`), восстанавливает снимки (`manifests-with-data-restoration`) и загружает их (`manifests-and-children-refs-upload`), как `admin` пространства имён в RBACv2. Спецификация `Snapshot` неизменяема, поэтому `update` и `patch` на неё не выдаются ни одному уровню. Загрузка дерева с томами также создаёт его `VolumeSnapshot`; `Admin` может это делать с версией storage-foundation или snapshot-controller, которая выдаёт запись `VolumeSnapshot` уровню `Editor`."
  - "Снимок неймспейса больше не захватывает копии, которые модуль Deckhouse `secret-copier` делает с Secret неймспейса `default` во всех остальных неймспейсах (Secret с лейблом `secret-copier.deckhouse.io/enabled` вне `default`, например wildcard-сертификат TLS). Admission-политика `secret-copier` разрешает создавать такой Secret только Deckhouse, поэтому восстановление никогда не могло его применить, а в восстановленный неймспейс модуль кладёт копию сам. Новые релизы Deckhouse ставят на копии и лейбл `heritage: deckhouse`, который уже исключался; правило покрывает релизы, где его нет. Исходный Secret в `default` по-прежнему попадает в снимок. В снимках, сделанных раньше, копия остаётся, и применить её при восстановлении по-прежнему нельзя."

security:
  - "Уровень доступа `ClusterEditor` текущей ролевой модели больше не может изменять внутренние ресурсы модуля (`ManifestCaptureRequest`, `ManifestCheckpoint`, `SnapshotContent` и подресурсы `status` у `Snapshot` и `SnapshotContent`) и только читает `SnapshotContent`, а `ClusterAdmin` получает это чтение от него; уровень `User` больше не читает `ManifestCheckpoint`, поэтому ниже `SuperAdmin` его не читает ни один уровень доступа текущей ролевой модели. Создавать и удалять снимки `ClusterEditor` по-прежнему может через уровень `Editor`."
  - "В RBACv2 уровень `manager` пространства имён больше не может изменять `ManifestCaptureRequest`, а уровень `manager` подсистемы хранения — `ManifestCheckpoint`: это внутренние ресурсы модуля, как и в текущей ролевой модели. Роли `d8:namespace-capability:state-snapshotter:edit` и `d8:use:capability:module:state-snapshotter:edit`, которые выдавали только это, удалены, а в DKP ниже 1.78 удалена и `d8:manage:permission:module:state-snapshotter:edit`. Чтение остаётся у уровней `viewer` пространства имён и подсистемы хранения."
  - "Скачивание манифестов узлов снимка (`manifests-download`) в RBACv2 переходит от `manager` пространства имён к `admin` пространства имён, а в DKP ниже 1.78 роль `d8:use:capability:module:state-snapshotter:download_snapshots` больше не агрегируется в use-роль `manager` и выдаётся только явной привязкой, как роли восстановления и загрузки. Скачивание возвращает все объекты, захваченные в пространстве имён, в том числе тех видов, которые вызывающий не может прочитать напрямую, поэтому теперь оно требует уровня, которому можно читать их все."

breaking:
  - "`manager` пространства имён в RBACv2, а в DKP ниже 1.78 — субъект с use-ролью `manager`, больше не может скачивать манифесты снимков (`manifests-download`), поэтому `d8 snapshot download` и средства резервного копирования с этим уровнем получат `Forbidden`: выдайте уровень `admin` пространства имён или привяжите `d8:namespace-capability:state-snapshotter:download_snapshots` (в DKP ниже 1.78 — `d8:use:capability:module:state-snapshotter:download_snapshots`). Поскольку `update` и `patch` на `Snapshot` не выдаются ни одному пользовательскому уровню, снять финализатор с зависшего `Snapshot` теперь может только `SuperAdmin`."

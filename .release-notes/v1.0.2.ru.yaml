date: "2026-11-03"

summary: "Самостоятельный снимок, загруженный обратно в кластер, теперь завершает импорт, а руководство по интеграции с системами резервного копирования описывает работу со всеми видами снимков и с любой частью дерева снимка."

highlights:
  - "Импорт самостоятельного `VolumeSnapshot` (`spec.mode: Import` без родительского снимка) теперь завершается. Раньше импорт ждал родителя, который не появлялся."
  - "Импортированный корневой снимок вида, который несёт данные тома, например снимок диска, теперь получает `status.data`, и его том можно скачать снова."
  - "Руководство по интеграции с системами резервного копирования объясняет, как создавать и восстанавливать `VolumeSnapshot` и другие виды снимков, зарегистрированные через `CustomSnapshotDefinition`, и как загружать любое выбранное поддерево снимка."

fixes:
  - "Импорт самостоятельного `VolumeSnapshot` теперь завершается: его `SnapshotContent` создаётся и привязывается без родительского снимка. Раньше такой импорт не достигал `Ready=True`."
  - "Импортированный корневой снимок вида, у которого в `CustomSnapshotDefinition` задано `requiresDataArtifact: true`, теперь публикует `status.data` так же, как дочерний узел. Раньше у такого корня поле оставалось пустым, и его том нельзя было скачать."
  - "Сообщение, которым отклоняется поле `spec.resourceSelector` в `Snapshot`, больше не утверждает, что в `d8` удалён флаг `-l/--selector`: оно говорит не использовать этот флаг с `d8 snapshot create`."

docs:
  - "Руководство по интеграции описывает обязанности внешней системы резервного копирования: поддерживать скачивание и загрузку всех видов снимков, зарегистрированных через `CustomSnapshotDefinition`, и перед каждой операцией заново получать список видов, потому что он различается от кластера к кластеру."
  - "Руководство описывает, как создать самостоятельный `VolumeSnapshot` или снимок доменного вида, например `VirtualMachineSnapshot`, как проверить его готовность и как загрузить его обратно."
  - "Руководство описывает, как загрузить любое выбранное поддерево снимка, в том числе несколько независимых поддеревьев за одну операцию, и когда узел несёт данные тома."

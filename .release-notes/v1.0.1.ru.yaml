date: "2026-10-29"

summary: "Снимок namespace больше не уносит объекты, которые ломают восстановление или повторяют работу при нём, опубликованный снимок сохраняет артефакт, с которым был сделан, а уровень логирования модуля применяется так, как задан."

highlights:
  - "Снимок namespace больше не захватывает объекты, которые восстановление не может создать или которые после восстановления заново запускают свою работу: объекты Project этого namespace, запросы на перенос данных модуля storage-foundation и операции модуля backup."
  - "Опубликованный снимок больше нельзя незаметно перенаправить на артефакт, снятый в другой момент."
  - "Настройка `logLevel` применяется так, как задана, а метрики контроллера собирает Prometheus."

new_features:
  - "Настройка `highAvailability` в `ModuleConfig` включает или выключает режим высокой доступности контроллера. Раньше режим всегда следовал глобальной настройке или числу master-узлов, и в кластере с тремя master-узлами и одним системным узлом вторая реплика контроллера оставалась в `Pending`."
  - "На DKP 1.78 и новее модуль создаёт роли в модели RBACv2: ClusterRole `d8:system-capability:state-snapshotter:view` и `:edit`, а также `d8:namespace-capability:state-snapshotter:view`, `:edit`, `:view_snapshots`, `:manage_snapshots`, `:download_snapshots`, `:restore_snapshots` и `:upload_snapshots`. Роль для внешней системы резервного копирования называется `d8:state-snapshotter:backup-agent`. На DKP ниже 1.78 прежние роли создаются без изменений."

improvements:
  - "Prometheus теперь собирает метрики контроллера через `ServiceMonitor`: метрики циклов согласования (reconcile) и очередей работ controller-runtime, задержку запросов client-go и собственные метрики модуля `state_snapshotter_unified_runtime_*`. Метрики отдаются через `kube-rbac-proxy`, а порт проверки состояния контроллера больше не публикуется через Service модуля."

fixes:
  - "Настройка `logLevel` применялась на два уровня строже заданного: при `INFO` в лог попадали только ошибки, при `DEBUG` попадали только предупреждения и ошибки, а при `TRACE` отладочные сообщения всё равно отбрасывались. Теперь уровень применяется так, как задан, в том числе к логам controller-runtime."
  - "При новой установке, когда storage-foundation устанавливает CRD `VolumeSnapshot` уже после запуска этого модуля, `VolumeSnapshot` так и не получал `SnapshotContent` и не мог быть выгружен, пока контроллер не перезапускали. Теперь контроллер подхватывает эти CRD, когда они появляются."
  - "Снимок namespace больше не захватывает объекты, которые multitenancy manager создаёт для Project этого namespace (с меткой `heritage=multitenancy-manager`), например `AvailableClusterResource`, который платформа отказывается создавать при восстановлении. Собственные объекты пользователя в namespace проекта по-прежнему попадают в снимок."
  - "Снимок namespace больше не захватывает `VolumeCaptureRequest`, `VolumeRestoreRequest`, `DataExport` и `DataImport` модуля storage-foundation, а также `Backup`, `BackupPlan` и `BackupRestore` модуля backup. После восстановления эти объекты заново запускали перенос данных или резервное копирование."
  - "Восстановленный Pod больше не сохраняет `spec.nodeName`. С этим полем планировщик пропускал Pod, и восстановленный PersistentVolumeClaim с режимом привязки `WaitForFirstConsumer` оставался в `Pending`."
  - "Опубликованный снимок можно было перенаправить на артефакт, снятый в другой момент, и при этом он оставался `Ready`: когда обновление статуса стирало состояние захвата у доменного снимка (объекта снимка, который создаёт модуль-владелец ресурса, например `VolumeSnapshot`), модуль выполнял захват повторно и публиковал новую контрольную точку поверх старой. Теперь ссылка на опубликованный артефакт задаётся один раз, состояние захвата восстанавливается из сохранённого артефакта, а у доменного снимка появляется событие `CaptureStateRestored`."

security:
  - "`golang.org/x/net` обновлён до v0.62.0 в контроллере, вебхуках и хуках, что закрывает CVE-2026-56851, CVE-2026-78659, CVE-2026-78660, CVE-2026-78661, CVE-2026-78663, CVE-2026-78669, CVE-2026-97032 и CVE-2026-97045."
  - "OpenTelemetry обновлён до v1.45.0 в контроллере, что закрывает CVE-2026-81870."
  - "Библиотеки `k8s.io` обновлены до v0.34 в контроллере, чтобы получить `cel-go` v0.29.0, что закрывает GHSA-gcjh-h69q-9w9g."
  - "`github.com/klauspost/compress` обновлён до v1.18.7 в хуках, что закрывает CVE-2026-63209."
  - "`github.com/docker/distribution` удалён из хуков, что закрывает CVE-2026-85747."

upgrade_notes:
  - "Значение `logLevel` по умолчанию теперь `INFO` вместо `DEBUG`. Вместе с исправлением уровней это значит, что модуль без заданного `logLevel` теперь пишет информационные сообщения, а раньше писал только предупреждения и ошибки."
  - "На DKP 1.78 и новее прежние роли модуля больше не создаются, их заменяют роли RBACv2, поэтому RoleBinding или ClusterRoleBinding, который ссылается на прежнюю роль по имени, нужно перевести на новую. Прежняя роль агента резервного копирования `d8:use:capability:module:state-snapshotter:backup_agent` остаётся устаревшим псевдонимом роли `d8:state-snapshotter:backup-agent`, поэтому существующие привязки к ней продолжают работать. На DKP ниже 1.78 ничего делать не нужно."

docs:
  - "Документация перестроена: появились страницы о кастомных ресурсах модуля и об архивах снимков. Справочник по кастомным ресурсам полностью переведён на русский язык и теперь описывает `ManifestCaptureRequest`, `ManifestCheckpoint` и `ManifestCheckpointContentChunk`."
  - "Руководство по интеграции с системами резервного копирования описывает резервное копирование узлов снимка любого вида и снимков отдельных ресурсов."

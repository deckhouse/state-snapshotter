date: "2026-11-05"

summary: "SnapshotContent, который отказывается перенаправить опубликованный артефакт, больше не засыпает события повторами."

highlights:
  - "Событие `Warning` с причиной `PublishedIdentityHeld` у `SnapshotContent` создаётся один раз на каждый отказ, а не на каждом проходе согласования."

improvements:
  - "`SnapshotContent`, который отказывается перенаправить уже опубликованный манифестный чекпоинт или артефакт данных, теперь создаёт событие `Warning` с причиной `PublishedIdentityHeld` один раз на отказ, а не на каждом проходе согласования — для ещё не готового (`Ready`) ресурса это было раз в полсекунды. В событии теперь указаны опубликованная идентичность и та, от которой контроллер отказался; отказ от другого кандидата — новое событие. Причины событий модуля (`NamespacePlanUnreadable`, `PublishedIdentityHeld`, `CaptureStateRestored`) не меняются."

date: "2026-xx-xx"
summary: ""
highlights: []

improvements:
  - "On DKP 1.78 and later, the `d8:system-capability:state-snapshotter:view` and `d8:system-capability:state-snapshotter:edit` roles also give read access to the `state-snapshotter` ModuleConfig, and `edit` write access to it, and carry the standard titles and descriptions of the platform, as every capability of the DKP 1.78 role model does. The RBAC of the module is now declared in `rbac.yaml`, and the RBACv2 templates are written from it."

fixes:
  - "The `Editor` and `Admin` access levels of the current role model can now create and delete `Snapshot` objects, and the `User` level reads `Snapshot` objects and their status. Before, writing and even reading a `Snapshot` took `ClusterEditor`. `Admin` also downloads the manifests of snapshot nodes (`manifests-download`), restores snapshots (`manifests-with-data-restoration`) and uploads them (`manifests-and-children-refs-upload`), as the namespace `admin` does in RBACv2. A `Snapshot` spec is immutable, so no level gets `update` or `patch` on it. Uploading a tree with volumes also creates its `VolumeSnapshot` objects, which `Admin` may do with the storage-foundation or snapshot-controller version that grants writing `VolumeSnapshot` objects to `Editor`."

security:
  - "The `ClusterEditor` access level of the current role model no longer writes the internal resources of the module (`ManifestCaptureRequest`, `ManifestCheckpoint`, `SnapshotContent` and the `status` subresources of `Snapshot` and `SnapshotContent`) and keeps only reading `SnapshotContent`, which `ClusterAdmin` gets from it; the `User` level no longer reads `ManifestCheckpoint`, so no access level of the current role model below `SuperAdmin` reads it. `ClusterEditor` keeps creating and deleting snapshots through the `Editor` level."
  - "In RBACv2 the namespace `manager` level no longer writes `ManifestCaptureRequest` and the storage `manager` level no longer writes `ManifestCheckpoint`: both are internal resources of the module, as in the current role model. The `d8:namespace-capability:state-snapshotter:edit` and `d8:use:capability:module:state-snapshotter:edit` roles, which granted only that, are removed, and below DKP 1.78 so is `d8:manage:permission:module:state-snapshotter:edit`. Reading stays with the namespace and storage `viewer` levels."
  - "Downloading the manifests of snapshot nodes (`manifests-download`) moves from the namespace `manager` to the namespace `admin` in RBACv2, and below DKP 1.78 the `d8:use:capability:module:state-snapshotter:download_snapshots` role no longer aggregates into the `manager` use role and has to be bound explicitly, as the restore and upload roles are. The download returns every object captured in the namespace, including the kinds its caller cannot read directly, so it now takes the level that may read all of them."

breaking:
  - "A namespace `manager` in RBACv2, and on DKP below 1.78 a subject with the `manager` use role, can no longer download snapshot manifests (`manifests-download`), so `d8 snapshot download` and backup tools running under that level get `Forbidden`: grant the namespace `admin` level or bind `d8:namespace-capability:state-snapshotter:download_snapshots` (below DKP 1.78, `d8:use:capability:module:state-snapshotter:download_snapshots`). With no `update` or `patch` on `Snapshot` objects at any user level, removing a finalizer from a stuck `Snapshot` now takes `SuperAdmin`."


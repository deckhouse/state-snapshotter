    controller-gen.kubebuilder.io/version: v0.18.0
  labels:
    module: state-snapshotter
  name: customsnapshotdefinitions.state-snapshotter.deckhouse.io
spec:
  group: state-snapshotter.deckhouse.io
  names:
    kind: CustomSnapshotDefinition
    listKind: CustomSnapshotDefinitionList
    plural: customsnapshotdefinitions
    shortNames:
    - csd
    singular: customsnapshotdefinition
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.weight
      name: Weight
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="AccessGranted")].status
      name: AccessGranted
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Registers a snapshot kind provided by another Deckhouse Platform
          module for a source resource kind.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
            x-doc-skip: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
            x-doc-skip: true
          metadata:
            type: object
            x-doc-skip: true
          spec:
            description: Maps one source resource kind to the snapshot kind that handles
              it.
            properties:
              apiVersion:
                description: API version of the snapshot resource.
                minLength: 1
                type: string
              kind:
                description: Kind of the snapshot resource.
                minLength: 1
                type: string
              requiresDataArtifact:
                description: Shows whether this snapshot kind requires a captured
                  volume-data artifact before it can become ready.
                type: boolean
              source:
                description: Source Kubernetes resource kind handled by this definition.
                properties:
                  apiVersion:
                    description: API version of the source resource.
                    minLength: 1
                    type: string
                  kind:
                    description: Kind of the source resource.
                    minLength: 1
                    type: string

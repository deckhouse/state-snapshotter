spec:
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Snapshot захватывает или импортирует состояние одного неймспейса в виде неизменяемого дерева снимка.
        properties:
          spec:
            description: |-
              Определяет способ получения содержимого снимка.
            properties:
              mode:
                description: |-
                  Определяет, захватывается ли содержимое из активного неймспейса или импортируется.

                  В режиме Capture захватывается текущее состояние неймспейса. В режиме Import содержимое загружается через API, а состояние активного неймспейса не захватывается.
          status:
            properties:
              boundSnapshotContentName:
                description: |-
                  Имя SnapshotContent, связанного с этим Snapshot.
              captureState:
                description: 'Ход захвата в режиме Capture.'
                properties:
                  commonController:
                    description: Состояние захвата этого узла, которое формирует основной контроллер.
                    properties:
                      childSubtreesManifestsPersisted:
                        description: |-
                          Показывает, сохранены ли манифесты всех объявленных дочерних поддеревьев.

                          Собственные манифесты этого узла учитываются отдельно в `manifestCaptured`.
                      childrenSettled:
                        description: |-
                          Показывает, завершили ли обработку все прямые дочерние узлы — успешно или с ошибкой, после которой обработка не повторяется.

                          Значение `true` означает завершение обработки, но не её успешность. Поле отсутствует у узла без прямых дочерних узлов или пока значение не вычислено.
                      dataCaptured:
                        description: "Показывает, захвачены ли данные тома этого узла.\n\nОтсутствует у узлов без данных тома."
                      manifestCaptured:
                        description: Показывает, захвачены ли манифесты этого узла.
                      subtreePlanned:
                        description: 'Показывает, завершено ли планирование этого узла и всех его дочерних поддеревьев.'
                  domainSpecificController:
                    description: Состояние захвата этого узла, которое формирует доменный контроллер.
                    properties:
                      excludedRefs:
                        description: |-
                          Исходные объекты, исключённые непосредственно этим узлом во время захвата.
                        items:
                          description: |-
                            Ссылка на исходный объект, исключённый из снимка.
                          properties:
                            apiVersion:
                              description: Версия API исключённого исходного ресурса.
                            kind:
                              description: Вид исключённого исходного ресурса.
                            name:
                              description: Имя исключённого исходного объекта.
                      manifestCaptureRequestName:
                        description: Имя временного ManifestCaptureRequest для захвата манифестов этого узла.
                      message:
                        description: |-
                          Описание текущей фазы.
                      phase:
                        description: 'Текущая фаза захвата доменным контроллером.'
                      reason:
                        description: 'Машиночитаемая причина текущей фазы.'
                      volumeCaptureRequestName:
                        description: Имя временного запроса для захвата данных тома этого узла.
              childrenSnapshotRefs:
                description: Прямые дочерние узлы снимка в том же неймспейсе.
                items:
                  description: |-
                    Ссылка на прямой дочерний узел снимка в том же неймспейсе.
                  properties:
                    apiVersion:
                      description: Версия API ресурса дочернего узла снимка.
                    kind:
                      description: Вид ресурса дочернего узла снимка.
                    name:
                      description: Имя объекта дочернего узла снимка.
              conditions:
                description: |-
                  Текущие условия Snapshot.
                items:
                  description: |-
                    Текущее условие.
                  properties:
                    lastTransitionTime:
                      description: |-
                        Время последнего изменения статуса условия.
                    message:
                      description: |-
                        Сведения об условии.
                    observedGeneration:
                      description: |-
                        Поколение объекта, на основе которого установлено условие.
                    reason:
                      description: |-
                        Машиночитаемая причина последнего изменения условия.
                    status:
                      description: |-
                        Статус условия.
                    type:
                      description: |-
                        Тип условия.
              excludedRefs:
                description: Исходные объекты, исключённые из этого поддерева снимка.
                items:
                  description: |-
                    Ссылка на исходный объект, исключённый из снимка.
                  properties:
                    apiVersion:
                      description: Версия API исключённого исходного ресурса.
                    kind:
                      description: Вид исключённого исходного ресурса.
                    name:
                      description: Имя исключённого исходного объекта.
              sourceRef:
                description: 'Ссылка на исходный объект, состояние которого представлено этим узлом снимка.'
                properties:
                  namespace:
                    description: Неймспейс исходного объекта.
                  uid:
                    description: UID исходного объекта.
                  apiVersion:
                    description: Версия API исходного ресурса.
                  kind:
                    description: Вид исходного ресурса.
                  name:
                    description: Имя исходного объекта.
            description: |-
              Текущая привязка, дерево и состояние готовности Snapshot.
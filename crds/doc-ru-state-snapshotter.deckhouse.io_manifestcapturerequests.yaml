spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Запрос на захват состояния указанных объектов Kubernetes в чекпоинт манифестов.
          properties:
            apiVersion:
              description: |
                Версия API представления объекта.
                Серверы преобразуют распознанные схемы в последнее внутреннее значение
                и могут отклонять нераспознанные значения.
                Подробнее: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            kind:
              description: |
                Тип REST-ресурса, который представляет объект.
                Серверы могут определять это значение по конечной точке, на которую клиент отправляет запросы.
                Нельзя обновить после создания.
                Значение в формате CamelCase.
                Подробнее: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            spec:
              properties:
                targets:
                  description: |
                    Объекты для захвата. Должен содержать хотя бы одну цель — как минимум манифест самого
                    снимаемого объекта. Снимок одного доменного объекта передаёт собственную идентичность источника,
                    а агрегатор корня namespace всегда включает свой объект Namespace, поэтому корректный захват
                    никогда не бывает пустым. Пустой (или опущенный) набор целей нарушает контракт: SDK отказывает
                    с ErrEmptyManifest ещё до создания запроса, а CRD отклоняет его CEL-правилом уровня spec выше
                    ("has(self.targets) && size(self.targets) > 0").
                    Набор — это ЗАМОРОЖЕННЫЙ план захвата на момент времени: после создания запроса он НЕИЗМЕНЯЕМ
                    (CEL-правило перехода уровня spec "self.targets == oldSelf.targets" отклоняет любое изменение).
                    SDK создаёт запрос один раз и никогда его не патчит; вызывающий, который пересчитывает меняющийся
                    набор (например, корень namespace над живым namespace), молча остаётся с первым планом.
                    Все цели должны быть namespaced-объектами в том же namespace, что и ManifestCaptureRequest,
                    за единственным исключением: собственный объект Namespace (core v1 Namespace с именем, равным
                    namespace самого ManifestCaptureRequest) — единственная допустимая cluster-scoped цель.
                  items:
                    properties:
                      apiVersion:
                        description: APIVersion целевого объекта.
                      kind:
                        description: |
                          Kind целевого объекта.
                          Cluster-scoped ресурсы (Node, PersistentVolume, ClusterRole и т. п.) не допускаются,
                          за единственным исключением: core v1 Namespace с именем, равным namespace самого
                          ManifestCaptureRequest (собственный объект Namespace захвата).
                      name:
                        description: Имя целевого объекта.
            status:
              properties:
                checkpointName:
                  description: Имя cluster-scoped ресурса ManifestCheckpoint, созданного по этому запросу.
                completionTimestamp:
                  description: Время завершения обработки запроса.
                conditions:
                  description: |
                    Условия, отражающие последние наблюдения состояния запроса.
                    Используется только условие Ready: True при успехе или False при окончательной ошибке.
                    Условие Ready выставляется только в конечном состоянии (окончательный успех или окончательная ошибка).
                  items:
                    description: |
                      Условие содержит подробности одного аспекта текущего состояния этого ресурса API.
                    properties:
                      lastTransitionTime:
                        description: |
                          Время последнего перехода условия из одного статуса в другой.
                          Обычно соответствует моменту изменения базового условия.
                      message:
                        description: |
                          Человекочитаемое сообщение с подробностями о переходе статуса.
                          Может быть пустой строкой.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, на основе которого было установлено условие.
                      reason:
                        description: |
                          Программный идентификатор причины последнего перехода условия.
                      status:
                        description: Статус условия — True, False или Unknown.
                      type:
                        description: Тип условия в формате CamelCase или foo.example.com/CamelCase.

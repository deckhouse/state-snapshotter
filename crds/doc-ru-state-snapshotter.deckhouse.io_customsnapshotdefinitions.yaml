spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            CustomSnapshotDefinition регистрирует пользовательские типы снимков для модулей платформы.
          properties:
            apiVersion:
              description: |
                Версия API представления объекта.
                Серверы преобразуют распознанные схемы в последнее внутреннее значение
                и могут отклонять нераспознанные значения.
                Подробнее: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            kind:
              description: |
                Тип REST-ресурса, который представляет объект.
                Серверы могут определять это значение по конечной точке, на которую клиент отправляет запросы.
                Нельзя обновить после создания.
                Значение в формате CamelCase.
                Подробнее: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            spec:
              description: |
                CustomSnapshotDefinitionSpec сопоставляет один GVK исходного ресурса с GVK снимка, который его
                материализует. Один CSD регистрирует ровно один тип снимка (плоская схема): apiVersion/kind снимка
                находятся на верхнем уровне, а снимаемый доменный ресурс задаётся полем Source.
              properties:
                apiVersion:
                  description: apiVersion ресурса снимка, который материализует Source.
                kind:
                  description: Kind ресурса снимка, который материализует Source.
                requiresDataArtifact:
                  description: |
                    Отмечает, что этот тип снимка несёт ветвь данных тома: обобщённый контроллер должен дождаться
                    артефакта данных (при захвате — SnapshotContent.status.data.artifactRef) или соответствующего
                    DataImport (при импорте), прежде чем сообщить Ready. Типы снимков только с манифестами (без данных
                    тома) задают false.
                source:
                  description: GVK снимаемого доменного ресурса.
                weight:
                  description: |
                    Задаёт порядок универсального обхода типов снимков по возрастанию значения: меньшие веса выполняются
                    первыми (более ранняя волна обхода), как FlowSchema.spec.matchingPrecedence и NodeGroupConfiguration.spec.weight
                    в Deckhouse. Это НЕ значение PriorityClass Kubernetes (где побеждает большее число) — порядок здесь обратный.
            status:
              properties:
                conditions:
                  description: |
                    Условия несут три разных сигнала, у каждого — единственный писатель:
                      - Accepted — spec корректен и может быть зарегистрирован (записывает reconciler CSD);
                      - AccessGranted — RBAC на стороне ядра для GVR этого CSD применён (SA core-контроллера, SA DataExport
                        и SA вебхуков — последний только на чтение исходных GVR, для проверки целей запросов на захват);
                        записывает core-хук 030-domain-rbac. Права собственного SA домена поставляются статически вместе
                        с модулем домена и этим условием НЕ покрываются;
                      - Ready — агрегат Ready = Accepted && AccessGranted.
                    Accepted и Ready расходятся, когда Accepted=True, но AccessGranted=False (spec принят, RBAC ещё
                    не применён) → Ready=False; столбцы вывода показывают все три условия, поэтому это видно сразу.
                  items:
                    description: |
                      Условие содержит подробности одного аспекта текущего состояния этого ресурса API.
                    properties:
                      lastTransitionTime:
                        description: |
                          Время последнего перехода условия из одного статуса в другой.
                          Обычно соответствует моменту изменения базового условия. Если он неизвестен,
                          допустимо использовать время изменения поля API.
                      message:
                        description: |
                          Человекочитаемое сообщение с подробностями о переходе статуса.
                          Может быть пустой строкой.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, на основе которого было установлено условие.
                          Например, если текущее значение `.metadata.generation` равно 12, а `.status.conditions[x].observedGeneration` — 9,
                          условие устарело относительно текущего состояния экземпляра.
                      reason:
                        description: |
                          Программный идентификатор причины последнего перехода условия.
                          Производители конкретных типов условий могут определять ожидаемые значения и смысл этого поля,
                          а также то, считаются ли эти значения гарантированной частью API.
                          Значение должно быть строкой в формате CamelCase.
                          Поле не может быть пустым.
                      status:
                        description: Статус условия — True, False или Unknown.
                      type:
                        description: Тип условия в формате CamelCase или foo.example.com/CamelCase.

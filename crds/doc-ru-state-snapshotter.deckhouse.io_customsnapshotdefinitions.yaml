spec:
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'CustomSnapshotDefinition регистрирует вид снимка, предоставляемый другим модулем Deckhouse Platform
          для исходного вида ресурса.'
        properties:
          spec:
            description: 'Связывает один вид исходного ресурса с видом снимка, который его обрабатывает.'
            properties:
              apiVersion:
                description: Версия API ресурса снимка.
              kind:
                description: Вид ресурса снимка.
              requiresDataArtifact:
                description: 'Показывает, требуется ли этому виду снимка артефакт захваченных данных тома до перехода в состояние
                  готовности.'
              source:
                description: Вид исходного ресурса Kubernetes, который обрабатывает это определение.
                properties:
                  apiVersion:
                    description: Версия API исходного ресурса.
                  kind:
                    description: Вид исходного ресурса.
              weight:
                description: 'Порядок обхода для этого вида снимка. Меньшие значения обрабатываются раньше.'
          status:
            properties:
              conditions:
                description: |-
                  Текущие условия. Accepted отражает корректность определения, AccessGranted — наличие требуемого доступа, Ready — общую готовность.
                items:
                  description: |-
                    Текущее условие.
                  properties:
                    lastTransitionTime:
                      description: |-
                        Время последнего изменения статуса условия.
                    message:
                      description: |-
                        Сведения об условии.
                    observedGeneration:
                      description: |-
                        Поколение объекта, на основе которого установлено условие.
                    reason:
                      description: |-
                        Машиночитаемая причина последнего изменения условия.
                    status:
                      description: |-
                        Статус условия.
                    type:
                      description: |-
                        Тип условия.
            description: Текущее состояние принятия определения, доступа и готовности.

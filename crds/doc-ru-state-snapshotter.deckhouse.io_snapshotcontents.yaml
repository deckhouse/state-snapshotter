spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            SnapshotContent хранит результат снимка (общий носитель для нескольких корневых типов снимков).

            Спецификация неизменяема, ЗА ИСКЛЮЧЕНИЕМ обратной ссылки snapshotRef, которую путь восстановления
            из корзины перенаправляет на заново созданный субъект снимка. Это единственное исключение
            разрешено только при выставленной защёлке корзины status.boundSnapshotDeleted: пока владеющий Snapshot жив,
            ссылка заморожена (защита от подмены), и перенаправить её можно только после удаления родителя.
          properties:
            apiVersion:
              description: |
                Версия API представления объекта.
                Серверы преобразуют распознанные схемы в последнее внутреннее значение
                и могут отклонять нераспознанные значения.
                Подробнее: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            kind:
              description: |
                Тип REST-ресурса, который представляет объект.
                Серверы могут определять это значение по конечной точке, на которую клиент отправляет запросы.
                Нельзя обновить после создания.
                Значение в формате CamelCase.
                Подробнее: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            spec:
              properties:
                deletionPolicy:
                  description: |
                    Определяет, может ли контроллер удалить этот SnapshotContent при удалении корневого снимка.
                snapshotRef:
                  description: |
                    Обязательная обратная ссылка на субъект снимка, которому принадлежит этот SnapshotContent; аналог
                    VolumeSnapshotContent.spec.volumeSnapshotRef. Устанавливается при создании тем контроллером, который
                    привязывает SnapshotContent через status.boundSnapshotContentName снимка (core Snapshot, доменный
                    XXXSnapshot или CSI VolumeSnapshot для узлов томов-«сирот»), и служит защитой от подмены: путь
                    восстановления принимает SnapshotContent только тогда, когда эта ссылка указывает обратно на тот самый
                    снимок, который на него сослался, поэтому пользователь не может подключить чужой SnapshotContent,
                    указав на него в status.boundSnapshotContentName. Пока владеющий Snapshot жив, ссылка неизменяема;
                    перенаправить её на заново созданный субъект можно только после того, как защёлка
                    status.boundSnapshotDeleted установлена в true (см. правила XValidation на уровне объекта). Защита
                    от подмены при этом не ослабляется: восстановление выполняется перенаправлением ссылки на
                    идентичность нового субъекта, а не обходом проверки.
                  properties:
                    uid:
                      description: |
                        UID — тип для хранения уникальных идентификаторов, в том числе UUID. Поскольку используются
                        не ТОЛЬКО UUID, это псевдоним типа string. Отдельный тип фиксирует назначение значения
                        и помогает не путать UID с именами.
            status:
              properties:
                boundSnapshotDeleted:
                  description: |
                    Одноразовая внутренняя защёлка, которую устанавливает компонент привязки, когда привязанный
                    namespaced-объект Snapshot удалён, а этот cluster-scoped SnapshotContent продолжает существовать
                    (корзина). После установки в true контроллер SnapshotContent больше не добавляет повторно финализатор
                    защиты родителя (снимка уже нет), и сборка мусора может продолжиться. Монотонна (только false -> true);
                    заменяет прежнюю аннотацию snapshot.deckhouse.io/parent-deleted.
                captureState:
                  description: |
                    Необязательно содержит записываемые ядром поля подавления для доменного читателя; на агрегаторе
                    SnapshotContent, которым владеет ядро, обычно не задано.
                  properties:
                    commonController:
                      description: |
                        Содержит записываемые ядром защёлки успеха ветвей захвата. Единственный писатель — ядро.
                      properties:
                        childSubtreesManifestsPersisted:
                          description: |
                            Фиксирует, что поддеревья ВСЕХ объявленных прямых потомков этого узла полностью сохранены: каждый
                            узел-потомок под каждым прямым потомком надёжно заархивировал свои манифесты. Поле намеренно
                            НЕ учитывает СОБСТВЕННЫЕ манифесты этого узла (их отслеживает ManifestCaptured): «весь узел сохранён»
                            раскладывается как ManifestCaptured && ChildSubtreesManifestsPersisted.
                            Поскольку поле не зависит от собственной ветви манифестов этого узла, оно может стать true ДО того, как
                            узел создаст свой MCR, — именно это позволяет использовать его как предварительный шлюз для исключения
                            манифестов. Узел без потомков считается сохранённым тривиально (true). Это НЕ ветвь захвата: поле
                            НЕ входит в CoreCaptureOutcome и отличается от ManifestCaptured (который читает корневой RBAC-хук).
                            Его назначение — дешёвый namespaced предварительный шлюз для вычисления исключения манифестов в SDK
                            (SubtreeManifestIdentities): агрегатор читает СВОЮ защёлку, чтобы решить, когда пытаться построить
                            собственный MCR (base - exclude), не обращаясь к подресурсу subtree-manifest-identities, пока потомки
                            ещё захватываются. Шлюз работает по принципу best-effort: этот подресурс работает в режиме fail-closed
                            (409, пока хотя бы один MCP поддерева не в состоянии Ready), поэтому корректность сохраняется
                            и при отсутствии защёлки. Вычисляется ядром по защёлкам SnapshotContent прямых потомков (сверка
                            объявленных и связанных — в режиме fail-closed; лист тривиально true). Ядро заранее объявляет поле
                            равным false на барьере захвата 1 и монотонно переводит его в true, когда поддеревья потомков
                            сохранены (узел без потомков выставляет true на первом проходе), — после барьера 1 поле намеренно
                            НЕ остаётся nil, поскольку nil отключает предварительный шлюз SDK (nil = шлюз выключен). Записывается
                            в снимок «сбоку». nil — ещё не вычислено / нет привязанного SnapshotContent либо адаптер, который
                            это поле не отображает (шлюз SDK выключен, обратная совместимость). Монотонно (false -> true).
                        childrenSettled:
                          description: |
                            Вычисляемая ядром монотонная защёлка: true, как только КАЖДЫЙ ПРЯМОЙ потомок ЭТОГО узла перешёл
                            в терминальное состояние — успешно захвачен ИЛИ завершился ошибкой. Формально childrenSettled(n) =
                            для каждого прямого потомка c: isTerminal(c), где isTerminal(c) = c.Ready==True OR c.phase in
                            {Finished,Failed} OR IsReasonTerminal(c.Ready). По сути это ChildrenReady, в котором терминальная
                            ОШИБКА потомка тоже считается «завершённостью»: сигнал полноты, ОРТОГОНАЛЬНЫЙ успеху, а не агрегат
                            успеха. (Ready не может играть эту роль: его терминальное False сводит «один потомок упал, остальные
                            ещё в процессе» и «один упал, все закончили» к неразличимому False, а собственное Ready=True родителя
                            выводится только ПОСЛЕ того, как его домен достиг phase=Finished, — циклическая зависимость для
                            потребителя, которому нужно действовать ДО завершения.)

                            Защёлка принадлежит снимку и записывается основным контроллером: она вычисляется разрешением ПРЯМЫХ
                            потомков владельца по status.childrenSnapshotRefs и чтением условия Ready И доменной фазы каждого
                            потомка, а затем записывается «СБОКУ» в этот снимок (как SubtreePlanned; у SnapshotContent нет фазы,
                            поэтому поле не может находиться в нём). Доменная phase=Failed потомка читается НАПРЯМУЮ (а не
                            выводится из терминальной причины Ready): ядро переносит произвольную причину phase=Failed домена
                            В ИСХОДНОМ ВИДЕ в Ready потомка, а произвольной причины нет в TerminalReadyReasons, поэтому одного
                            IsReasonTerminal недостаточно, чтобы заметить отказ домена.

                            Используется тот же механизм fail-closed до заморозки, что и для ChildrenReady: набор прямых потомков
                            владельца замораживается на барьере захвата 1 (phase >= Planned), а объявленный, но ещё не созданный
                            потомок считается нетерминальным, поэтому защёлка никогда не станет true при неполном наборе потомков.
                            Это НЕ ветвь захвата (не входит в CoreCaptureOutcome и не учитывается AllLegsCaptured). Домены только
                            ЧИТАЮТ её — например, домен выполняет действие для согласованности (fs unfreeze) по условию
                            childrenSettled==true, которое должно сработать, даже если снимок данных потомка завершился ошибкой;
                            потомок, который ЗАВИС (никогда не становится терминальным), обрабатывается дедлайном на стороне
                            домена, а не этой защёлкой. nil — прямых потомков нет (лист) или ещё не вычислено. Монотонна
                            (nil/false -> true; спецификация неизменяема, поэтому никакой повторный захват не вернёт её назад).
                        dataCaptured:
                          description: |
                            Защёлка успеха ветви данных; объявляется только там, где есть линия данных (у узлов без данных
                            отсутствует = nil, например у корня namespace или у агрегата только из манифестов). Родитель читает
                            dataCaptured потомка, чтобы выбрать момент для freeze/unfreeze.
                        manifestCaptured:
                          description: |
                            Защёлка успеха ветви манифестов (объявляется на каждом узле захвата). nil — ветви нет;
                            false — объявлена, ещё не захвачена; true — захвачена. На корневом Snapshot её читает RBAC-хук.
                        subtreePlanned:
                          description: |
                            Вычисляемая ядром монотонная рекурсивная защёлка: true, как только ЭТОТ узел достиг барьера захвата 1
                            (domainSpecificController.phase >= Planned) И SubtreePlanned каждого ПРЯМОГО потомка равно true, — то
                            есть всё поддерево завершило планирование (объекты и ссылки опубликованы, но не обязательно
                            захвачены/Ready). Защёлка принадлежит снимку и записывается основным контроллером (агрегатор вычисляет
                            её, разрешая прямых потомков владельца по status.childrenSnapshotRefs и читая защёлку каждого потомка,
                            а затем записывает её «СБОКУ» в этот снимок; у SnapshotContent нет фазы, поэтому поле не может
                            находиться в нём).
                            Волна «сиротских»/остаточных PVC корня ждёт SubtreePlanned его прямых потомков, чтобы PVC-«сирота»
                            оценивался только тогда, когда покрытие каждого объявленного поддерева полностью вычислимо (без
                            преждевременного исключения на корне).
                            Это НЕ ветвь захвата (не входит в CoreCaptureOutcome). Домены только ЧИТАЮТ её. nil — поддерево ещё
                            не спланировано. Монотонна (nil/false -> true; спецификация неизменяема, поэтому никакой повторный
                            захват не вернёт её назад).
                    domainSpecificController:
                      description: |
                        Содержит записываемые доменом ссылки планирования и жизненный цикл. Единственный писатель — домен (SDK).
                      properties:
                        excludedRefs:
                          description: |
                            ПРЯМЫЕ запреты домена на этом узле: исходные объекты, которые он отбросил (по метке исключения)
                            при перечислении своих потомков. Это временные ВХОДНЫЕ данные, которые ядро читает и сворачивает
                            в долговременный агрегат SnapshotContent.status.excludedRefs; домен никогда не пишет ни агрегат,
                            ни зеркало верхнего уровня (оба принадлежат ядру).

                            Записывается БЕЗ omitempty: пустой список ([]) означает «домен выполнил планирование, ничего
                            не исключено» и ДОЛЖЕН отличаться от «домен ещё не выполнил планирование» (domainSpecificController
                            отсутствует). Лист данных (например, диск) никогда не перечисляет потомков, поэтому всегда записывает [].
                            Отсутствует в режиме Import (живого захвата не происходит).
                          items:
                            description: |
                              ExcludedObjectRef идентифицирует один исходный объект, исключённый из снимка (элемент
                              status.excludedRefs в Snapshot/доменных CR и SnapshotContent). Это «тень» SnapshotChildRef:
                              та же форма {apiVersion,kind,name}, но ссылка указывает на ИСХОДНЫЙ объект, отсечённый запретом
                              (меткой state-snapshotter.deckhouse.io/exclude или явным отбрасыванием на верхнем уровне), а не на
                              дочерний снимок. Namespace подразумевается (namespace снимка).

                              В отличие от childrenSnapshotRefs (прямые рёбра), долговременный агрегат в SnapshotContent собирает
                              исключённые ссылки ВСЕГО поддерева, поскольку исключённый объект ненавигируем: для него не создаётся
                              CR снимка, поэтому в него нельзя спуститься, чтобы позже восстановить представление по узлам.
                        manifestCaptureRequestName:
                          description: |
                            Временный MCR, которым владеет доменный узел, пока выполняется захват собственной области.
                        message:
                          description: |
                            Человекочитаемые подробности для текущего значения Phase (ход выполнения на этапе Planning,
                            подробности ошибки при Failed). Очищается при Planned/Finished.
                        phase:
                          description: |
                            Барьер жизненного цикла домена (Planning|Planned|Finished|Failed). Planned замораживает состав
                            потомков и исключённых объектов и включает проекцию захвата на стороне ядра. Обычный домен публикует
                            свой MCR/VCR до Planned; текущий поток агрегатора, управляемый поддеревом, может опубликовать
                            собственный MCR позже — когда манифесты потомков сохранены и доступен полный набор исключений.
                        reason:
                          description: |
                            Короткие машиночитаемые подробности для текущего значения Phase (произвольная строка домена):
                            коды хода выполнения на этапе Planning (например, Snapshotting), причина ошибки при Failed.
                            Очищается при Planned/Finished.
                        volumeCaptureRequestName:
                          description: |
                            Временный VCR, которым владеет доменный узел-лист данных, пока выполняется ветвь данных.
                childrenSnapshotContentRefs:
                  description: |
                    Перечисляет прямые дочерние объекты SnapshotContent в дереве снимка.

                    Содержит ЗАМОРОЖЕННЫЙ ожидаемый набор потомков узла, записываемый ОДНИМ переходом ЕДИНСТВЕННЫМ
                    писателем — агрегатором (SnapshotContentController): агрегатор проецирует его из замороженного
                    status.childrenSnapshotRefs владеющего снимка (устанавливается однократно при phase=Planned)
                    и публикует ПОЛНЫЙ набор только после того, как каждый объявленный дочерний снимок материализовал
                    и привязал свой SnapshotContent (всё или ничего; см. PublishSnapshotContentChildrenFromSnapshotRefs).
                    До этого ничего не записывается, поэтому поле переходит из пустого состояния в полное одним патчем
                    и никогда не растёт постепенно. ChildrenReady — чистый пересчёт относительно него (без мигания);
                    упавший потомок остаётся узлом, поэтому ребро сохраняется.

                    Правило перехода XValidation делает эту неизменяемость гарантией на уровне API: как только набор
                    непуст, он заморожен — нельзя добавлять, удалять, переупорядочивать или заменять элементы.
                    Единственное допустимое изменение — переход из пустого набора в заданный (oldSelf.size()==0).
                    Безопасность обеспечивает публикация единственным писателем по принципу «всё или ничего»: правило
                    заблокировало бы писателя, дописывающего элементы постепенно, поэтому его стало возможно применять
                    только после того, как агрегатор стал единственным писателем дочерних рёбер.
                    self==oldSelf — поэлементное сравнение за O(n); MaxItems и MaxLength имени элемента ограничивают
                    оценочную стоимость CEL, чтобы apiserver принял CRD (неограниченный список или имя превысили бы
                    бюджет стоимости — именно поэтому предшествующему правилу монотонности размера со стоимостью O(1)
                    не требовалось ничего ограничивать). MaxItems=8192 — щедрый потолок числа прямых потомков узла
                    (далеко за пределами любого реалистичного ветвления), выбранный, чтобы стоимость оставалась
                    значительно ниже бюджета. Не помечено как Required: у тома-ЛИСТА потомков законно нет
                    (пусто или не задано).
                  items:
                    description: |
                      SnapshotContentChildRef идентифицирует один дочерний общий SnapshotContent в целевом графе
                      SnapshotContent. SnapshotContent — cluster-scoped-ресурс, поэтому ссылка содержит только имя
                      и НЕ ДОЛЖНА содержать namespace.
                    properties:
                      name:
                        description: |
                          Имя cluster-scoped дочернего SnapshotContent. MaxLength=253 — предел имени объекта Kubernetes
                          (DNS-поддомен), поэтому реально ничего не ограничивает; здесь он ОБЯЗАТЕЛЕН, чтобы ограничить
                          оценочную стоимость CEL для правила неизменяемости замороженного набора
                          childrenSnapshotContentRefs (self == oldSelf), которое иначе предполагает неограниченную строку
                          в каждом элементе и превышает бюджет стоимости apiserver (CRD отклоняется).
                conditions:
                  items:
                    description: |
                      Условие содержит подробности одного аспекта текущего состояния этого ресурса API.
                    properties:
                      lastTransitionTime:
                        description: |
                          Время последнего перехода условия из одного статуса в другой.
                          Обычно соответствует моменту изменения базового условия. Если он неизвестен,
                          допустимо использовать время изменения поля API.
                      message:
                        description: |
                          Человекочитаемое сообщение с подробностями о переходе статуса.
                          Может быть пустой строкой.
                      observedGeneration:
                        description: |
                          Значение `.metadata.generation`, на основе которого было установлено условие.
                          Например, если текущее значение `.metadata.generation` равно 12, а `.status.conditions[x].observedGeneration` — 9,
                          условие устарело относительно текущего состояния экземпляра.
                      reason:
                        description: |
                          Программный идентификатор причины последнего перехода условия.
                          Производители конкретных типов условий могут определять ожидаемые значения и смысл этого поля,
                          а также то, считаются ли эти значения гарантированной частью API.
                          Значение должно быть строкой в формате CamelCase.
                          Поле не может быть пустым.
                      status:
                        description: Статус условия — True, False или Unknown.
                      type:
                        description: Тип условия в формате CamelCase или foo.example.com/CamelCase.
                data:
                  description: |
                    Единственная привязка «исходный PVC → артефакт данных» для этого логического узла снимка.
                    Кардинальность ≤1 по замыслу: узел несёт не более одного артефакта данных; несколько томов
                    представляются отдельными дочерними узлами томов (childrenSnapshotContentRefs), а не списком здесь.
                    Это долговременный самодостаточный блок {sourceRef, artifactRef, метаданные тома}, который ядро
                    зеркалирует в status.data верхнего уровня namespaced-снимка.
                  properties:
                    artifactRef:
                      description: |
                        Ссылается на cluster-scoped долговременный артефакт данных (например, VolumeSnapshotContent).
                      properties:
                        uid:
                          description: |
                            UID долговременного артефакта данных (например, UID VolumeSnapshotContent). Делает ссылку
                            на артефакт самодостаточной, симметрично sourceRef.uid. Необязательно: на артефакт можно
                            сослаться до того, как станет известен его UID, поэтому производители заполняют поле
                            по возможности (best-effort).
                    fsType:
                      description: |
                        Тип файловой системы источника (только для томов Filesystem).
                    size:
                      description: |
                        Реальный выделенный размер захваченного тома, взятый из артефакта данных
                        (VolumeSnapshotContent.status.restoreSize). Снимок живёт дольше исходного PVC, поэтому размер
                        ДОЛЖЕН сохраняться здесь, чтобы пересоздать том при восстановлении или экспорте (VolumeRestoreRequest
                        экспорта задаёт по нему размер целевого PVC). Хранится как строка resource.Quantity (например, "10Gi"),
                        чтобы модуль api не имел зависимостей; контроллеры разбирают её через resource.ParseQuantity.
                    sourceRef:
                      description: |
                        Идентифицирует захваченный PersistentVolumeClaim (apiVersion/kind/name/namespace + uid), на котором
                        основаны данные этого узла. Его uid — единственный идентификатор тома; он заменяет прежнее
                        отдельное поле targetUID.
                        Это ссылка на базовый PVC (status.data.sourceRef); она отличается от status.sourceRef верхнего
                        уровня (SnapshotSourceObjectRef), который ссылается на захваченный живой доменный объект.
                      properties:
                        uid:
                          description: |
                            UID — тип для хранения уникальных идентификаторов, в том числе UUID. Поскольку используются
                            не ТОЛЬКО UUID, это псевдоним типа string. Отдельный тип фиксирует назначение значения
                            и помогает не путать UID с именами.
                    storageClassName:
                      description: |
                        StorageClass источника захваченного тома. Используется агрегированным /index
                        и сопоставлением StorageClass при импорте.
                    volumeMode:
                      description: |
                        Режим исходного тома (Block или Filesystem). CSI-снимки не зависят от режима тома, поэтому
                        он сохраняется здесь, чтобы управлять унифицированным экспортом (VolumeRestoreRequest)
                        и пересоздавать PVC при импорте. Имеет тип string, чтобы модуль api не имел зависимостей;
                        контроллеры преобразуют его в corev1.PersistentVolumeMode.
                excludedRefs:
                  description: |
                    ДОЛГОВРЕМЕННЫЙ АГРЕГАТ исходных объектов, исключённых из поддерева этого узла (собственные прямые
                    исключения узла, ОБЪЕДИНЁННЫЕ с прямыми исключениями всех потомков; на корне — ПЛЮС явные
                    отбрасывания верхнего уровня). Записывается ТОЛЬКО ядром (единственный агрегатор) и является
                    ИСТИНОЙ: находясь в cluster-scoped SnapshotContent, он переживает удаление namespaced-объекта
                    Snapshot (корзина), и именно его зеркалирует status.excludedRefs верхнего уровня. Это агрегат,
                    а не прямые рёбра (как childrenSnapshotContentRefs), поскольку исключённый объект ненавигируем:
                    для него не создаётся узел снимка, поэтому восстановить картину по узлам задним числом невозможно.
                  items:
                    description: |
                      ExcludedObjectRef идентифицирует один исходный объект, исключённый из снимка (элемент
                      status.excludedRefs в Snapshot/доменных CR и SnapshotContent). Это «тень» SnapshotChildRef:
                      та же форма {apiVersion,kind,name}, но ссылка указывает на ИСХОДНЫЙ объект, отсечённый запретом
                      (меткой state-snapshotter.deckhouse.io/exclude или явным отбрасыванием на верхнем уровне), а не на
                      дочерний снимок. Namespace подразумевается (namespace снимка).

                      В отличие от childrenSnapshotRefs (прямые рёбра), долговременный агрегат в SnapshotContent собирает
                      исключённые ссылки ВСЕГО поддерева, поскольку исключённый объект ненавигируем: для него не создаётся
                      CR снимка, поэтому в него нельзя спуститься, чтобы позже восстановить представление по узлам.
                manifestCheckpointName:
                  description: |
                    Имя cluster-scoped ManifestCheckpoint после того, как захват манифестов сохранён.
                subtreeManifestsPersisted:
                  description: |
                    Внутренняя монотонная рекурсивная защёлка ядра (true, как только собственный ManifestCheckpoint
                    этого узла в состоянии Ready И у каждого объявленного дочернего SnapshotContent
                    subtreeManifestsPersisted=true; fail-closed). Это поле SnapshotContent — долговременная истина;
                    видимые пользователю объекты не содержат этого поля верхнего уровня, но СОДЕРЖАТ записываемую ядром
                    защёлку только по потомкам в captureState.commonController.childSubtreesManifestsPersisted
                    (см. CommonControllerCaptureState), которая используется как предварительный шлюз исключения
                    манифестов. Поле служит целям, которые не сводятся к manifestCaptured отдельного узла:
                    (1) не допустить ПЕРВОЕ Ready=True при объявленных, но не связанных потомках; (2) управлять набором
                    исключений барьера волны для MCR агрегатора (полнота поддерева + связанность => нет двойного
                    захвата с 409; идентичности отдаёт подресурс subtree-manifest-identities); (3) монотонность
                    (никогда не открывается снова после первого Ready). Поле никогда не выражает отказ — терминальный
                    отказ захвата манифестов проявляется через причину Ready (IsReasonTerminal).

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  labels:
    module: state-snapshotter
  name: snapshots.state-snapshotter.deckhouse.io
spec:
  group: state-snapshotter.deckhouse.io
  names:
    kind: Snapshot
    listKind: SnapshotList
    plural: snapshots
    shortNames:
    - snap
    singular: snapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.boundSnapshotContentName
      name: Content
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Snapshot captures or imports the state of one namespace as an
          immutable snapshot tree.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
            x-doc-skip: true
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
            x-doc-skip: true
          metadata:
            type: object
            x-doc-skip: true
          spec:
            description: Defines how snapshot content is obtained.
            properties:
              deletionPolicy:
                description: |-
                  Defines what deleting the Snapshot does to the stored snapshot tree. Applies to Capture only.

                  Retain (the default) keeps the stored tree until the retention period configured for the module expires.
                  Delete removes the stored tree and the volume snapshots created for it as soon as the Snapshot is deleted.
                  Use Delete when the snapshot has already been copied out of the cluster.
                  A VolumeSnapshot that existed in the namespace before the capture keeps its own deletion policy.
                enum:
                - Retain
                - Delete
                type: string
              mode:
                default: Capture
                description: |-
                  Selects whether content is captured from the live namespace or imported.

                  Capture reads live namespace state. Import waits for content supplied through the upload API and does not capture live state.
                enum:
                - Capture
                - Import
                type: string
              resourceSelector:
                description: |-
                  Removed field. A Snapshot with this field is rejected.
                  To exclude objects from capture, use the `state-snapshotter.deckhouse.io/exclude` label.

                  Deprecated: never read and never set this field.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-doc-skip: true
                x-kubernetes-map-type: atomic
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
            - message: 'spec.resourceSelector is not supported: a Snapshot captures
                its whole namespace. Remove the field and do not use -l/--selector
                with d8 snapshot create; to keep objects out of a snapshot, label
                them state-snapshotter.deckhouse.io/exclude'
              rule: '!has(self.resourceSelector)'
            - message: 'spec.deletionPolicy applies to Capture only: an imported snapshot
                is always reclaimed when it is deleted. Drop the field from an Import
                snapshot'
              rule: '!has(self.deletionPolicy) || !has(self.mode) || self.mode !=
                ''Import'''
          status:
            description: Current binding, tree, and readiness state of the Snapshot.
            properties:
              boundSnapshotContentName:
                description: Name of the SnapshotContent bound to this Snapshot.
                maxLength: 253
                type: string
                x-kubernetes-validations:
                - message: 'Snapshot status.boundSnapshotContentName is set-once:
                    the bound SnapshotContent name cannot be replaced'
                  rule: self == oldSelf
              captureState:
                description: Capture progress exposed in status during Capture mode.
                properties:
                  commonController:
                    description: Core capture progress for this node.
                    properties:
                      childSubtreesManifestsPersisted:
                        description: |-
                          Shows whether manifests for all declared child subtrees have been persisted.

                          This node’s own manifests are tracked separately by `manifestCaptured`.
                        type: boolean
                      childrenSettled:
                        description: |-
                          Shows whether all direct child nodes have finished processing, successfully or with an error that is not retried.

                          A `true` value indicates completion, not success. Omitted for a node without direct children or until the value is calculated.
                        type: boolean
                      dataCaptured:
                        description: |-
                          Shows whether this node’s volume data has been captured.

                          Omitted for nodes without volume data.
                        type: boolean
                      manifestCaptured:
                        description: Shows whether this node’s manifests have been
                          captured.
                        type: boolean
                      subtreePlanned:
                        description: Shows whether planning is complete for this node
                          and all child subtrees.
                        type: boolean
                    type: object
                  domainSpecificController:
                    description: Domain-specific capture progress for this node.
                    properties:
                      excludedRefs:
                        description: Source objects excluded directly by this node
                          during capture.
                        items:
                          description: Reference to a source object excluded from
                            the snapshot.
                          properties:
                            apiVersion:
                              description: API version of the excluded source resource.
                              type: string
                            kind:
                              description: Kind of the excluded source resource.
                              type: string
                            name:
                              description: Name of the excluded source object.
                              type: string
                          required:
                          - apiVersion
                          - kind
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      manifestCaptureRequestName:
                        description: Name of the temporary ManifestCaptureRequest
                          used to capture this node’s manifests.
                        type: string
                      message:
                        description: Description of the current phase.
                        type: string
                      phase:
                        description: Current domain capture phase.
                        enum:
                        - Planning
                        - Planned
                        - Finished
                        - Failed
                        type: string
                      reason:
                        description: Machine-readable reason for the current phase.
                        type: string
                      volumeCaptureRequestName:
                        description: Name of the temporary request used to capture
                          this node’s volume data.
                        type: string
                    type: object
                type: object
              childrenSnapshotRefs:
                description: Direct child snapshot nodes in the same namespace.
                items:
                  description: Reference to a direct child snapshot node in the same
                    namespace.
                  properties:
                    apiVersion:
                      description: API version of the child snapshot resource.
                      type: string
                    kind:
                      description: Kind of the child snapshot resource.
                      type: string
                    name:
                      description: Name of the child snapshot object.
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  type: object
                type: array
              conditions:
                description: Current Snapshot conditions.
                items:
                  description: Current condition.
                  properties:
                    lastTransitionTime:
                      description: Time of the last condition status change.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable details about the condition.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: Object generation observed when this condition
                        was set.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: Programmatic reason for the last condition transition.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Condition status.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              excludedRefs:
                description: Source objects excluded from this snapshot subtree.
                items:
                  description: Reference to a source object excluded from the snapshot.
                  properties:
                    apiVersion:
                      description: API version of the excluded source resource.
                      type: string
                    kind:
                      description: Kind of the excluded source resource.
                      type: string
                    name:
                      description: Name of the excluded source object.
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              sourceRef:
                description: Reference to the source object whose state this snapshot
                  node represents.
                properties:
                  apiVersion:
                    description: API version of the source resource.
                    minLength: 1
                    type: string
                  kind:
                    description: Kind of the source resource.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the source object.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the source object.
                    type: string
                  uid:
                    description: UID of the source object.
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            type: object
        type: object
        x-kubernetes-validations:
        - message: 'Snapshot status.boundSnapshotContentName is set-once: the bound
            SnapshotContent name cannot be removed'
          rule: '!has(oldSelf.status) || !has(oldSelf.status.boundSnapshotContentName)
            || (has(self.status) && has(self.status.boundSnapshotContentName))'
    served: true
    storage: true
    subresources:
      status: {}

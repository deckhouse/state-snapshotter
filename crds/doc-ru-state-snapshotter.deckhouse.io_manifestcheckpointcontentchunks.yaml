spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Фрагмент (чанк) данных чекпоинта манифестов ManifestCheckpoint.
          properties:
            apiVersion:
              description: |
                Версия API представления объекта.
                Серверы преобразуют распознанные схемы в последнее внутреннее значение
                и могут отклонять нераспознанные значения.
                Подробнее: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            kind:
              description: |
                Тип REST-ресурса, который представляет объект.
                Серверы могут определять это значение по конечной точке, на которую клиент отправляет запросы.
                Нельзя обновить после создания.
                Значение в формате CamelCase.
                Подробнее: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            spec:
              properties:
                checkpointName:
                  description: Имя ManifestCheckpoint, к которому относится этот чанк.
                checksum:
                  description: |
                    SHA256-хеш сжатых данных чанка (в кодировке base64).
                    Используется для проверки целостности и отладки.
                data:
                  description: |
                    Gzip-сжатый JSON-массив объектов в кодировке base64.
                    Формат: base64(gzip(json[])).
                index:
                  description: Индекс чанка (с нуля).
                objectsCount:
                  description: Количество объектов в этом чанке.

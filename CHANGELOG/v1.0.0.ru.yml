Изменения:
  - Первый релиз, уровень General Availability. Модуль снимает состояние namespace целиком —
    манифесты объектов и данные томов; снимок представлен деревом, в котором за каждый узел отвечает
    владеющий им модуль.
  - Объект, который не должен попасть в снимок, помечается лейблом
    state-snapshotter.deckhouse.io/exclude. Значение лейбла не важно — достаточно самого ключа.
  - Снимок можно скачать и загрузить обратно, а манифесты из него модуль отдаёт готовыми к
    применению, с уже переписанными ссылками. Конфликты с тем, что в целевом namespace уже есть,
    модуль не разрешает — их решает клиент, d8 или веб-консоль.
  - Автовключается в бандлах Default, Managed и Minimal — базовая функциональность резервного
    копирования доступна всегда.
  - Требует Deckhouse >= 1.76.9 — версию, поставляющую совместимый d8 CLI. На кластерах ниже модуль
    не активируется.
  - Снимки доступны не только администратору кластера — работать с ними может любой, кому выданы
    соответствующие права.

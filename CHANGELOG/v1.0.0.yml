Changes:
  - First release, at the General Availability level. The module captures the entire state of a
    namespace, both its object manifests and its volume data. A snapshot is a tree in which each node
    is served by the module that owns it.
  - An object that must not go into a snapshot carries the state-snapshotter.deckhouse.io/exclude
    label. The value of the label is ignored; the key alone is enough.
  - A snapshot can be downloaded and uploaded back, and the module hands out its manifests ready to
    apply, with references already rewritten. The module does not resolve conflicts with what the
    target namespace already holds; a client does that, either d8 or the web console.
  - Enabled automatically in the Default, Managed and Minimal bundles, so basic backup functionality
    is always available.
  - Requires Deckhouse >= 1.76.9, the release that ships a compatible d8 CLI. On anything earlier the
    module does not activate.
  - Snapshots are not for the cluster administrator alone. Anyone granted the matching permissions can
    work with them.
